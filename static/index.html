<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音助手</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#1d2939;--muted:#667085;--line:#e4e8f0;--soft:#f2f5f9;--brand:#16735f;--brand-ink:#0f5546;--brand-soft:#e5f3ee;
--info:#2f6fde;--info-soft:#e8f0fd;--warn:#b7791f;--warn-soft:#fbf3e4;--danger:#c0392b;--danger-soft:#fbeceb;--success:#16735f;--success-soft:#e5f3ee;
--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid #cfd6e2;border-radius:10px;padding:9px 12px;background:#fff;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,115,95,.15)}
textarea{width:100%;resize:vertical}input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
input[type=file]{border:0;padding:0}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}.brand strong{display:block;font-size:16px}.brand small{color:var(--muted);font-size:12px}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff}
nav{flex:1;overflow:auto}.nav-group{margin-bottom:14px}.nav-title{font-size:12px;color:var(--muted);padding:4px 10px;letter-spacing:.04em}
.nav-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;color:#344054;text-decoration:none;margin:1px 0}
.nav-item:hover{background:var(--soft)}.nav-item.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.sidebar-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:12px 8px 0;font-size:13px}
.who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.link{border:0;background:none;color:var(--brand);cursor:pointer;padding:0}
.topbar{display:none}.scrim{display:none}
.content{padding:28px 36px 48px;min-width:0}
.page{max-width:1040px;margin:0 auto}
.page-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.page-head h1{font-size:24px;margin:0 0 4px}.page-head p{margin:0;color:var(--muted);font-size:14px;max-width:680px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.card-head h2{font-size:16px;margin:0}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.grid-2>.card{margin-bottom:0}.grid-2{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:disabled{opacity:.5;cursor:default}.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover:not(:disabled){background:var(--brand-ink)}
.btn-secondary{background:#fff;border-color:#cfd6e2;color:#344054}.btn-secondary:hover:not(:disabled){background:var(--soft)}
.btn-ghost{background:transparent;color:#475467}.btn-ghost:hover:not(:disabled){background:var(--soft)}
.btn-danger{background:var(--danger);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.inline-form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.inline-form>input{flex:1}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.field-grow{flex:1;min-width:200px}
.field input,.field select,.field textarea{color:var(--ink);font-size:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 14px}.form-grid .field-grow{grid-column:1/-1}
.check{display:inline-flex;gap:6px;align-items:center;font-size:14px;padding-bottom:9px}
.muted{color:var(--muted)}.small{font-size:13px}.grow{flex:1;min-width:0}.footnote{margin-top:12px}
.status-line{margin:12px 0 0;color:var(--brand-ink);font-size:14px}
.notice{background:var(--warn-soft);color:#7a4f12;border-radius:10px;padding:8px 12px;font-size:14px}
.rows{list-style:none;margin:0;padding:0}.row{display:flex;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row.clickable{cursor:pointer;border-radius:8px}.row.clickable:hover{background:var(--soft)}
.when{font-variant-numeric:tabular-nums;color:var(--brand-ink);font-weight:600;font-size:14px;min-width:132px}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap}
.badge-neutral{background:var(--soft);color:#475467}.badge-info{background:var(--info-soft);color:var(--info)}
.badge-success{background:var(--success-soft);color:var(--success)}.badge-danger{background:var(--danger-soft);color:var(--danger)}.badge-warn{background:var(--warn-soft);color:var(--warn)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);padding:28px 12px;text-align:center}.empty p{margin:0;max-width:420px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:24px;font-weight:700;margin:2px 0}.stat-hint{color:var(--muted);font-size:12px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--soft)}td:first-child{font-weight:500}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 16px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed #cfd6e2;border-radius:12px;padding:26px;color:var(--muted);cursor:pointer;text-align:center}
.dropzone:hover{border-color:var(--brand);color:var(--brand-ink)}.dropzone input{display:none}
.file-pick{display:flex;gap:8px;align-items:center;flex:1;min-width:240px;border:1px dashed #cfd6e2;border-radius:10px;padding:9px 12px;color:var(--muted);cursor:pointer}
.file-pick input{display:none}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:380px}
.toast{display:flex;align-items:center;gap:10px;background:#1d2939;color:#fff;border-radius:12px;padding:10px 12px 10px 14px;box-shadow:0 8px 24px rgba(16,24,40,.2);font-size:14px}
.toast span{flex:1}.toast .btn-ghost{color:#9fe3cf}.toast-success{background:#0f5546}.toast-danger{background:#8f2a20}
.toast-close{border:0;background:none;color:#cbd5e1;font-size:18px;cursor:pointer;line-height:1}
.task-list{display:flex;flex-direction:column;gap:10px}.task{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.task-head{display:flex;gap:10px;align-items:center;cursor:pointer}.preview{margin-top:4px;white-space:pre-wrap}
.chevron{color:var(--muted);font-size:20px;transition:transform .15s}.chevron.open{transform:rotate(90deg)}
.task-body{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.progress-line{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--info);font-size:14px}
.spinner{width:14px;height:14px;border:2px solid var(--info-soft);border-top-color:var(--info);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result h3{font-size:14px;margin:0 0 6px;color:#344054}.result section{margin-bottom:14px}.prose{white-space:pre-wrap;line-height:1.7}
.todo{display:flex;gap:10px;align-items:center;padding:6px 0;flex-wrap:wrap}.todo small{display:block;color:var(--muted)}.todo input[type=datetime-local]{padding:5px 8px}
.transcript{max-height:320px;overflow:auto;margin-top:8px}.transcript p{margin:4px 0}.time{display:inline-block;min-width:52px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
details summary{cursor:pointer;color:#344054;margin:6px 0}
.script{font-size:15px;line-height:1.7}.player{width:100%}
.voice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.voice-option{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.voice-option:hover{border-color:#b9c3d3}.voice-option.selected{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 10px}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.english-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;align-items:start}
.english-side{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.mistake .fix{font-weight:600;color:var(--brand-ink)}
.viewer-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.viewer-lines{display:flex;flex-direction:column;gap:8px}.line{padding:10px 12px;border-radius:12px}.line-partner{background:var(--soft)}.line-me{background:var(--brand-soft)}
.line-who{font-size:12px;color:var(--muted)}.report{margin-top:12px;background:var(--soft);border-radius:12px;padding:12px}
.practice-note{margin-top:8px;padding:8px 10px;border-left:3px solid #d08a2c;background:var(--warn-soft);border-radius:8px;font-size:14px;white-space:normal}
.note-kind{font-size:12px;color:var(--muted)}.note-fix{font-weight:600}.note-why{font-size:13px;color:#475467}
.practice-review{display:flex;flex-direction:column;gap:4px;margin-top:8px;white-space:normal}
.chip{display:flex;gap:8px;align-items:baseline;font-size:13px;border-radius:8px;padding:4px 8px;background:var(--soft)}
.chip b{font-weight:600;white-space:nowrap}.chip-success{background:var(--success-soft);color:var(--success)}.chip-warn{background:var(--warn-soft);color:#7a4f12}
.chip-danger{background:var(--danger-soft);color:var(--danger)}.chip-neutral{background:var(--soft);color:#475467}
.turn-tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;white-space:normal}
.line-playing{outline:2px solid var(--brand);outline-offset:1px}.say-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.row.editing{background:var(--soft);border-radius:10px;padding:10px}.row.editing .reminder-form{flex:1}
.recorder{display:flex;gap:16px;align-items:center}.recorder-time{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:110px}
.recorder-level{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.recorder-level span{display:block;height:100%;background:var(--brand);transition:width .3s}
.password-form{display:grid;gap:8px;margin:8px 0 12px;padding:12px;background:var(--soft);border-radius:10px}.password-form .actions{margin-top:4px}
.chat-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.chat-list{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:0}
.chat-search{width:100%}.chat-row{padding:8px 6px}.chat-row.active{background:var(--brand-soft)}
.chat-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.icon-button{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:none}
.chat-row:hover .icon-button,.chat-row.active .icon-button{display:inline-flex}.icon-button:hover{background:#fff;color:var(--ink)}
.review-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:14px}
.quiz{border-color:#b9dccf}.questions{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:14px}
.question{padding:10px 12px;border-radius:10px;background:var(--soft)}.question.right{background:var(--success-soft)}.question.wrong{background:var(--danger-soft)}
.q-kind{font-size:12px;color:var(--muted)}.q-prompt{font-size:16px;margin:4px 0 6px}.question input,.question textarea{width:100%;margin-top:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;margin-top:6px}
.choice{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}
.choice.picked{border-color:var(--brand);background:var(--brand-soft)}.choice input{width:auto;margin:0}
.q-result{margin-top:8px;font-size:14px}
.zh{margin-top:6px;padding:6px 10px;border-radius:8px;background:#fff;border:1px dashed var(--line);color:#475467;font-size:14px;white-space:normal}
.lookup{position:fixed;z-index:60;width:320px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(16,24,40,.18);padding:12px 14px}
.lookup-head{display:flex;gap:8px;align-items:baseline}.lookup-head strong{font-size:16px;word-break:break-word}.lookup-phonetic{color:var(--muted);font-size:13px;flex:1}
.lookup-close{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.lookup-body{margin-top:6px;font-size:14px}.lookup-meaning{font-weight:600;color:var(--brand-ink)}.lookup-note{color:#475467;margin-top:4px}
.lookup-example{font-style:italic;color:#475467;margin-top:4px}.lookup-saved{font-size:12px;color:var(--muted);margin-top:6px}
#history .bubble,.line-text{user-select:text}.viewer-actions{margin:0 0 10px}
/* The chat dock: the engine's own elements, styled to sit in a page. */
.dock-slot{min-width:0}.dock{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
#history{height:min(58vh,620px);overflow:auto;padding:18px 20px;white-space:pre-wrap;scroll-behavior:smooth}
.dock-compact #history{height:min(52vh,560px)}
.dock-empty{color:var(--muted);text-align:center;margin:60px auto;max-width:360px}
.bubble{max-width:82%;margin-bottom:14px;padding:10px 14px;border-radius:14px;background:var(--soft)}
.bubble.user{margin-left:auto;background:var(--brand-soft)}.label{font-size:12px;color:var(--muted);margin-bottom:2px}
#confirmBox{margin:0 16px 12px;border-color:#f0c36d;background:#fffaf0}
.dock-bar{border-top:1px solid var(--line);padding:12px 16px;background:#fbfcfe}
.composer{display:flex;gap:8px}.composer input{flex:1}
.dock-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:#344054}
#status{flex:1;min-width:160px;color:var(--brand-ink);font-size:13px;text-align:right}
#level{width:100%;height:6px;margin-top:8px}
.mic-settings{margin-top:6px;font-size:14px}.mic-settings select{max-width:100%}
#vad,#micReport{font-size:13px;color:var(--muted);white-space:pre-wrap}
@media (max-width:900px){
.chat-layout{grid-template-columns:1fr}.chat-list{position:static;max-height:260px}.icon-button{display:inline-flex}
.app{grid-template-columns:1fr}.topbar{display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}
.menu-button{border:0;background:none;font-size:20px;cursor:pointer}
.sidebar{position:fixed;left:0;top:0;z-index:40;width:250px;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:none}
.scrim{display:block;position:fixed;inset:0;background:rgba(16,24,40,.3);z-index:30}
.content{padding:16px}.english-layout{grid-template-columns:1fr}.english-side{position:static;max-height:none}
.form-grid{grid-template-columns:1fr}.page-head{flex-direction:column}.bubble{max-width:92%}#status{text-align:left}
}
</style></head>
<body>
<div id="root"></div>
<!-- The chat dock: the voice engine's elements. React moves it into the 对话 and 英语对话 pages. -->
<div id="dockHome" hidden><div id="chatDock" class="dock" hidden>
  <div id="history" aria-live="polite"><p id="empty" class="dock-empty">点“开始说话”，说完自动提交；也可以先打字试试。</p></div>
  <div id="confirmBox" class="card" hidden><div id="confirmText"></div><div class="actions"><button id="confirmYes" class="btn btn-primary" type="button">确定执行</button><button id="confirmNo" class="btn btn-secondary" type="button">取消</button></div></div>
  <div class="dock-bar">
    <form id="form" class="composer"><input id="text" placeholder="输入文字，回车发送" maxlength="2000" autocomplete="off"><button id="send" class="btn btn-primary" disabled>发送</button></form>
    <div class="dock-controls">
      <button id="mic" class="btn btn-primary" type="button" disabled>开始说话</button>
      <button id="stop" class="btn btn-secondary" type="button" disabled>打断回复</button>
      <label class="toggle"><input id="tts" type="checkbox" checked> 语音播报</label>
      <label class="toggle"><input id="listen" type="checkbox"> 持续监听</label>
      <span id="status" role="status">正在连接…</span>
    </div>
    <meter id="level" min="0" max="1" value="0"></meter>
    <details class="mic-settings"><summary>麦克风设置</summary>
      <div class="inline-form"><select id="micDevice" aria-label="麦克风"></select><button id="micTest" class="btn btn-secondary btn-sm" type="button">麦克风诊断</button></div>
      <div id="vad"></div><div id="micReport"></div>
      <p class="muted small">首次要允许麦克风权限。停顿约 0.9 秒自动提交，每次最多 30 秒。持续监听时说的每句话都会回答，播报时直接说话可以打断，建议戴耳机。</p>
    </details>
  </div>
</div></div>
<script src="/static/vendor/react.production.min.js"></script><script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/ui/core.js?v=ui-14"></script><script src="/static/ui/pages.js?v=ui-14"></script><script src="/static/ui/voices.js?v=ui-14"></script>
<script src="/static/ui/meetings.js?v=ui-14"></script><script src="/static/ui/audio.js?v=ui-14"></script><script src="/static/ui/english.js?v=ui-14"></script>
<script src="/static/ui/shell.js?v=ui-14"></script>
<script src="/static/speech.js?v=ui-14"></script><script src="/static/app.js?v=ui-14"></script>
</body></html>
