# HTTPS in front of the app. Replace example.com with the domain, and put the certificate in deploy/certs as
# fullchain.pem and privkey.pem (from the cloud provider or Let's Encrypt).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Meeting recordings may be up to 200 MB.
    client_max_body_size 210m;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location /ws {
        proxy_pass http://app:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A conversation can stay open and quiet for a long time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static/ {
        proxy_pass http://app:8765;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        proxy_pass http://app:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Explaining, quizzes and uploads can take a while.
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
